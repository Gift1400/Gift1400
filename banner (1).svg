<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 753 203" width="1280" height="345" role="img" aria-label="Gift Mkhoma - Turning ideas into real software solutions" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b1c"/>
      <stop offset="1" stop-color="#07122a"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.72" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#0b3b66" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#050b1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050b1c" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#050b1c" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#050b1c" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect x="1" y="1" width="751" height="201" rx="9"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="753" height="203" fill="url(#bg)"/>
    <rect width="753" height="203" fill="url(#glowR)"/>

    <!-- circuit traces -->
    <g fill="none" stroke="#22b8ee" stroke-width="0.9" stroke-linejoin="round" opacity="0.55" filter="url(#soft)">
      <polyline points="250,0 270,20 330,20 345,35 345,70 372,97 420,97"/>
      <polyline points="330,20 400,20 418,38 470,38 488,56 560,56 580,38 640,38 662,42"/>
      <polyline points="372,97 372,130 395,152 450,152 470,172 547,172"/>
      <polyline points="420,97 470,97 488,115 540,115 556,131 620,131 640,111 700,111"/>
      <polyline points="470,38 470,12 520,0"/>
      <polyline points="560,56 560,92 588,115"/>
      <polyline points="620,131 620,160 650,185 680,203"/>
      <polyline points="662,42 662,16 690,0"/>
      <polyline points="700,111 730,81 753,81"/>
      <polyline points="450,152 450,203"/>
      <polyline points="547,172 580,172 600,190 640,190"/>
      <polyline points="640,111 640,90 662,68 662,42"/>
      <polyline points="400,20 400,0"/>
      <polyline points="330,20 330,0"/>
      <polyline points="300,203 320,180 360,180 372,168"/>
    </g>
    <!-- secondary faint traces -->
    <g fill="none" stroke="#1d6fa5" stroke-width="0.7" opacity="0.35">
      <polyline points="500,203 520,185 580,185"/>
      <polyline points="690,203 690,160 720,130 753,130"/>
      <polyline points="600,0 600,26 628,54 700,54"/>
      <polyline points="715,0 715,35 735,55 753,55"/>
      <polyline points="430,60 470,60 488,78 540,78"/>
    </g>

    <!-- small nodes -->
    <g fill="#38bdf8" opacity="0.8">
      <circle cx="345" cy="35" r="1.6"/><circle cx="345" cy="70" r="1.6"/>
      <circle cx="418" cy="38" r="1.6"/><circle cx="488" cy="56" r="1.6"/>
      <circle cx="580" cy="38" r="1.6"/><circle cx="395" cy="152" r="1.6"/>
      <circle cx="470" cy="172" r="1.6"/><circle cx="488" cy="115" r="1.6"/>
      <circle cx="556" cy="131" r="1.6"/><circle cx="640" cy="111" r="1.6"/>
      <circle cx="588" cy="115" r="1.6"/><circle cx="650" cy="185" r="1.6"/>
      <circle cx="730" cy="81" r="1.6"/><circle cx="600" cy="190" r="1.6"/>
    </g>
    <!-- glowing hero nodes -->
    <g filter="url(#glow)">
      <circle cx="330" cy="17" r="3.2" fill="#22d3ee"/>
      <circle cx="662" cy="42" r="3.2" fill="#38bdf8"/>
      <circle cx="372" cy="97" r="2.8" fill="#22d3ee"/>
      <circle cx="547" cy="172" r="3.2" fill="#2dd4bf"/>
      <circle cx="420" cy="97" r="2.4" fill="#38bdf8"/>
      <circle cx="700" cy="111" r="2.6" fill="#22d3ee"/>
      <circle cx="560" cy="92" r="2.2" fill="#38bdf8"/>
      <circle cx="450" cy="152" r="2.4" fill="#38bdf8"/>
      <circle cx="620" cy="160" r="2.2" fill="#2dd4bf"/>
      <circle cx="548" cy="95" r="2.6" fill="#facc15"/>
      <circle cx="505" cy="168" r="2.2" fill="#a78bfa"/>
      <circle cx="640" cy="68" r="2" fill="#2dd4bf"/>
    </g>

    <!-- left fade so text stays readable -->
    <rect width="470" height="203" fill="url(#fadeL)"/>
  </g>

  <!-- border -->
  <rect x="0.75" y="0.75" width="751.5" height="201.5" rx="9" fill="none" stroke="#1b2f52" stroke-width="1.5"/>

  <!-- code icon -->
  <text x="672" y="87" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="36" fill="#3b9cf5" filter="url(#soft)">&lt;/&gt;</text>

  <!-- left text -->
  <text x="30" y="63" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" letter-spacing="4.2" fill="#b4bfd1">GIFT MKHOMA</text>
  <text x="30" y="104" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" fill="#ffffff">Turning ideas into</text>
  <text x="30" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="600" fill="#1ea7fd">real software solutions.</text>
  <text x="30" y="172" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="2.6" fill="#b4bfd1">LEARN  /  BUILD  /  GROW</text>

  <!-- right text -->
  <g font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="9" letter-spacing="2.2" fill="#c7d0df" text-anchor="end">
    <text x="727" y="150">JAVA  /  SPRING BOOT</text>
    <text x="727" y="169">MYSQL  /  VUE.JS</text>
  </g>
</svg>
